# Keston ID, Postgres, and Caddy in front.
#
# Local (no .env needed):   docker compose up --build
#   http://id.keston.localhost     Keston ID
#   http://work.keston.localhost   Keston Work (a stand-in until the app exists)
#   http://admin.keston.localhost  Keston Admin (run the admin repo's compose too)
#
# Live on the VPS: copy .env.live.example to .env and fill it in. The same
# file then serves https://id.keston.co and https://work.keston.co.
#
# More replicas: docker compose up -d --scale keston-id=3. Each is stateless
# (sessions, keys and tokens are in Postgres), so Caddy spreads requests
# across them with no sticky sessions.

name: keston

# Settings every keston-id container shares. Defaults are for local use.
x-keston-id-env: &keston-id-env
  KESTON_ID_ISSUER: ${KESTON_ID_ISSUER:-http://id.keston.localhost}
  KESTON_ID_SECRET_KEY: ${KESTON_ID_SECRET_KEY:-}
  KESTON_ID_DATABASE_URL: postgres://keston:${POSTGRES_PASSWORD:-keston}@postgres:5432/keston_id?sslmode=disable
  KESTON_ID_ACCESS_TOKEN_TTL: ${KESTON_ID_ACCESS_TOKEN_TTL:-15m}
  KESTON_ID_REFRESH_TOKEN_TTL: ${KESTON_ID_REFRESH_TOKEN_TTL:-720h}
  KESTON_ID_SESSION_TTL: ${KESTON_ID_SESSION_TTL:-336h}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KESTON_ID_SITE: ${KESTON_ID_SITE:-http://id.keston.localhost}
      KESTON_WORK_SITE: ${KESTON_WORK_SITE:-http://work.keston.localhost}
      KESTON_ADMIN_SITE: ${KESTON_ADMIN_SITE:-http://admin.keston.localhost}
      KESTON_ID_ISSUER: ${KESTON_ID_ISSUER:-http://id.keston.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@keston.co}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      keston-id: { condition: service_healthy }
    networks: [keston]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keston
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keston}
      POSTGRES_DB: keston_id
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [keston]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keston -d keston_id"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off, before any replica serves: migrations, then register the apps
  # (deploy/clients.local.json locally, deploy/clients.json live).
  setup:
    build: .
    image: ghcr.io/thekestongroup/id:latest
    command: ["clients", "sync", "/etc/keston-id/${KESTON_ID_CLIENTS_FILE:-clients.local.json}"]
    environment:
      <<: *keston-id-env
      # Local app secret (clients.local.json). Live secrets have no defaults.
      KESTON_WORK_LOCAL_CLIENT_SECRET: ${KESTON_WORK_LOCAL_CLIENT_SECRET:-keston-work-local-secret}
      KESTON_LEARN_CLIENT_SECRET: ${KESTON_LEARN_CLIENT_SECRET:-}
      KESTON_SCHOOLS_CLIENT_SECRET: ${KESTON_SCHOOLS_CLIENT_SECRET:-}
      KESTON_WORK_CLIENT_SECRET: ${KESTON_WORK_CLIENT_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [keston]
    restart: "no"

  keston-id:
    image: ghcr.io/thekestongroup/id:latest
    restart: unless-stopped
    environment: *keston-id-env
    depends_on:
      setup: { condition: service_completed_successfully }
    networks: [keston]
    deploy:
      resources:
        limits: { memory: 128M }

networks:
  keston:
    name: keston

volumes:
  postgres:
  caddy-data:
  caddy-config:
