name: CI

# Runs on every pull request and on pushes to main. Read-only, with no Azure
# access: it checks the code and confirms the image builds, but pushes nothing.
# `Checks` and `Image builds` are the status checks to require on main.

on:
  push:
    branches: [main]
  pull_request:
  # Also once a week, so a vulnerability disclosed after the last change still
  # shows up even when nobody has pushed anything.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# Runs are grouped per PR or branch; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: id

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: web
        run: pnpm build

      # Known-vulnerable production dependencies. Fails on high or critical.
      - name: Audit web dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level=high

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The Go packages embed web/dist, so this runs after the web build.
      - name: Go vet
        working-directory: .
        run: go vet ./...

      - name: Go test
        working-directory: .
        run: go test ./...

      # Known vulnerabilities in the Go standard library and our modules, only
      # those our code can actually reach. Fixing one usually means raising the
      # `go` line in go.mod to the latest patch release.
      - name: Go vulnerability check
        working-directory: .
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing is pushed and there is no Azure sign-in. The Dockerfile's
      # default (last) stage is the production one.
      - name: Build (no push)
        run: docker build --tag "$IMAGE:pr" .

      # Scans the built image's operating system packages and binaries. Only
      # fails on high or critical findings that have a fix available.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:pr
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
